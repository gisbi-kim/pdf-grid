name: Legacy browser launcher (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-grid-desktop
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Stage offline assets and licenses
        shell: pwsh
        run: |
          python desktop/prepare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$(go env GOROOT)/LICENSE" desktop/web/LICENSE-GO.txt
          node --test dev/tests/core.test.cjs dev/tests/touch.test.cjs
      - name: Test and build Windows executables
        working-directory: desktop
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run tools/icon.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED='0'
          go build -trimpath '-ldflags=-s -w -H=windowsgui -X main.version=1.0.0' -o PDF-Grid-Portable.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath '-ldflags=-s -w -H=windowsgui -X main.version=1.0.0 -X main.installMode=setup' -o PDF-Grid-Setup.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test the actual Windows executable
        working-directory: desktop
        shell: pwsh
        run: |
          $app = Start-Process -FilePath ./PDF-Grid-Portable.exe -ArgumentList '--headless','--port','49382' -PassThru
          try {
            $ready=$false
            for ($n=0; $n -lt 30; $n++) {
              try { $info=Invoke-RestMethod http://127.0.0.1:49382/_local/info; $ready=$true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready -or $info.app -ne 'pdf-grid-desktop-v1') { throw 'Local app did not start' }
            $page=Invoke-WebRequest http://127.0.0.1:49382/dev/
            if ($page.Content -notmatch '/_local/runtime.js') { throw 'Offline UI was not embedded' }
            foreach ($asset in @('app.js','core.js','vendor/pdf-lib.min.js','vendor/jszip.min.js')) {
              $response=Invoke-WebRequest "http://127.0.0.1:49382/dev/$asset"
              if ($response.StatusCode -ne 200) { throw "Missing offline asset $asset" }
            }
          } finally { Stop-Process -Id $app.Id -ErrorAction SilentlyContinue }
      - name: Verify per-user install and desktop shortcut
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath ./desktop/PDF-Grid-Setup.exe -PassThru
          if (!$setup.WaitForExit(30000)) { Stop-Process -Id $setup.Id; throw 'Setup timed out' }
          if ($setup.ExitCode -ne 0) { throw 'Setup failed' }
          $target=Join-Path $env:LOCALAPPDATA 'PDFGrid/PDF-Grid.exe'
          $shortcut=Join-Path ([Environment]::GetFolderPath('Desktop')) 'PDF Grid.lnk'
          if (!(Test-Path $target) -or !(Test-Path $shortcut)) { throw 'Install or desktop shortcut missing' }
          $shell=New-Object -ComObject WScript.Shell
          if ($shell.CreateShortcut($shortcut).TargetPath -ne $target) { throw 'Shortcut target is incorrect' }
          try {
            $ready=$false
            for ($n=0; $n -lt 30; $n++) {
              try { $info=Invoke-RestMethod http://127.0.0.1:49381/_local/info; $ready=$true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (!$ready -or $info.app -ne 'pdf-grid-desktop-v1') { throw 'Installed app did not start' }
          } finally {
            Get-Process 'PDF-Grid' -ErrorAction SilentlyContinue | Stop-Process
            Remove-Item $shortcut -ErrorAction SilentlyContinue
            Remove-Item (Split-Path $target) -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Publish executable downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $tag="desktop-v1.0.0-build.$env:RUN_NUMBER"
          Get-FileHash desktop/PDF-Grid-Setup.exe,desktop/PDF-Grid-Portable.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii desktop/SHA256SUMS.txt
          gh release create $tag desktop/PDF-Grid-Setup.exe desktop/PDF-Grid-Portable.exe desktop/SHA256SUMS.txt --repo $env:RELEASE_REPO --target $env:RELEASE_COMMIT --title 'PDF Grid Offline 1.0.0' --notes-file desktop/RELEASE-NOTES.md --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
