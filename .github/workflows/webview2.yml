name: Build and release lightweight Windows app
on:
  push:
    branches: [main, codex/pdfgrid-webview2-1.4]
    paths: ['desktop-webview2/**', 'dev/**', 'viewer/**', 'index.html', 'scripts/**', '.github/workflows/webview2.yml']
  pull_request:
    branches: [main]
    paths: ['desktop-webview2/**', 'dev/**', 'viewer/**', 'index.html', 'scripts/**', '.github/workflows/webview2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: desktop-webview2/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build app and installer
        shell: pwsh
        working-directory: desktop-webview2
        run: |
          python ../scripts/sync-ui.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test web/dev/tests/*.test.cjs ../dev/tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED='0'
          go build -trimpath "-ldflags=-s -w -H=windowsgui -X main.buildNumber=$env:GITHUB_RUN_NUMBER -X main.buildCommit=$env:GITHUB_SHA" -o PDF-Grid.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis -y --no-progress
          & 'C:/Program Files (x86)/NSIS/makensis.exe' installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise native WebView2 and desktop features
        shell: pwsh
        working-directory: desktop-webview2
        run: |
          $env:PDFGRID_NATIVE_TEST='1'
          go test -run TestNativeUI -v -timeout 180s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise installer confirmations and replacement
        if: always()
        shell: pwsh
        working-directory: desktop-webview2
        run: ./tests/install-smoke.ps1
      - name: Prepare original runtime startup comparison
        if: contains(github.event.head_commit.message, '[benchmark]')
        working-directory: desktop-webview2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item benchmark/inputs -ItemType Directory -Force | Out-Null
          gh release download pdfgrid-benchmark-input-20261113 --repo gisbi-kim/pdf-grid --dir benchmark/inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmark/prepare.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item benchmark/apps/1.4.2 -ItemType Directory -Force | Out-Null
          go build -tags startupbenchmark -trimpath '-ldflags=-s -w -H=windowsgui' -o benchmark/apps/1.4.2/PDF-Grid.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare startup on the same Windows machine
        if: contains(github.event.head_commit.message, '[benchmark]')
        working-directory: desktop-webview2
        shell: pwsh
        run: ./benchmark/measure.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PDFGrid-1.5.1-Windows-verification
          path: |
            desktop-webview2/PDF-Grid.exe
            desktop-webview2/PDF-Grid-Desktop-Setup-1.5.1.exe
            desktop-webview2/tests/*.png
            desktop-webview2/tests/startup.json
            desktop-webview2/benchmark/provenance.json
            desktop-webview2/benchmark/results/*

      - name: Publish verified Windows downloads
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: desktop-webview2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item PDF-Grid-Desktop-Setup-1.5.1.exe PDF-Grid-Setup.exe
          Copy-Item PDF-Grid.exe PDF-Grid-Portable.exe
          Get-FileHash PDF-Grid-Setup.exe,PDF-Grid-Portable.exe,PDF-Grid-Desktop-Setup-1.5.1.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii SHA256SUMS.txt
          $tag="desktop-v1.5.1-build.$env:GITHUB_RUN_NUMBER"
          gh release create $tag PDF-Grid-Setup.exe PDF-Grid-Portable.exe PDF-Grid-Desktop-Setup-1.5.1.exe SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'PDF Grid 1.5.1 - Lightweight Windows app' --notes-file RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
